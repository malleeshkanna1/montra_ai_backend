[project]
name = "montra-ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "malleeshkanna", email = "malleeshkanna770@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings[dotenv]>=2.16.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
montra-ai-backend = "app.main:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
